<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MÍSTICA</title>

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
}
#cargando{
  text-align:center;
  padding:60px 20px;
  font-size:20px;
}
iframe{
  width:100%;
  height:100%;
  border:0;
}
</style>
</head>

<body>

<div id="cargando">Cargando MÍSTICA...</div>

<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>

<script>
(async function(){

  const mensaje = document.getElementById("cargando");

  try {

    mensaje.innerHTML = "Conectando con MÍSTICA...";

    if(typeof fflate === "undefined"){
      throw new Error("No se pudo cargar el sistema de archivos.");
    }

    const url =
      "https://raw.githubusercontent.com/ramireztere1503-collab/CATALOGO-MISTICA/main/MISTICA_CATALOGO_PUBLICO_CARRITO_WHATSAPP.zip";

    mensaje.innerHTML = "Descargando catálogo...";

    const respuesta = await fetch(url, {cache:"no-store"});

    if(!respuesta.ok){
      throw new Error("No se pudo descargar el catálogo. Código: " + respuesta.status);
    }

    const datos = new Uint8Array(
      await respuesta.arrayBuffer()
    );

    mensaje.innerHTML = "Preparando catálogo...";

    fflate.unzip(datos, function(error, archivos){

      try {

        if(error){
          throw new Error("No se pudo abrir el archivo del catálogo.");
        }

        const archivo = archivos["index.html"];

        if(!archivo){
          throw new Error("El catálogo no contiene index.html.");
        }

        const html = new TextDecoder().decode(archivo);

        const blob = new Blob(
          [html],
          {type:"text/html"}
        );

        const direccion = URL.createObjectURL(blob);

        const iframe = document.createElement("iframe");

        iframe.onload = function(){
          document.body.style.overflow = "hidden";
        };

        document.body.innerHTML = "";
        document.body.appendChild(iframe);

        iframe.src = direccion;

      } catch(e){

        document.body.innerHTML =
          "<div id='cargando'>" +
          "<h2>No se pudo cargar MÍSTICA</h2>" +
          "<p>" + e.message + "</p>" +
          "</div>";

      }

    });

  } catch(e){

    document.body.innerHTML =
      "<div id='cargando'>" +
      "<h2>No se pudo cargar MÍSTICA</h2>" +
      "<p>" + e.message + "</p>" +
      "<p>Revisá que el archivo del catálogo esté en GitHub.</p>" +
      "</div>";

  }

})();
</script>

</body>
</html>
